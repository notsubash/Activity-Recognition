# Protocol B, phone, statistical features, random forest (no scaler), GroupKFold 5.
seed: 42
data:
  processed_dir: data/processed
  device: phone
window:
  length_s: 5.0
  hop_s: 1.0
  min_coverage: 0.95
features:
  kind: statistical
model:
  name: rf
  params:
    n_estimators: 100
    n_jobs: -1
split:
  protocol: groupkfold
  n_splits: 5
tracking:
  experiment: wisdm-har
  protocol_name: B
  output_dir: docs/reports
