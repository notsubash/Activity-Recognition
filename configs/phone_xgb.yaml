# A1: closest student clone (PhoneXGB2). Flatten 80 samples, hop 40, leaky
# window split, early stop on the test set. Length is a row count, not seconds.
# Trains on repaired 20 Hz parquet from data/processed (session-safe windows).
# Not an unrepaired concat-table clone. Delta vs 0.8559 is not leakage-only.
seed: 42
data:
  processed_dir: data/processed
  device: phone
window:
  length_samples: 80
  hop_samples: 40
  min_coverage: 0.95
features:
  kind: raw_flat
model:
  name: xgboost
  params:
    colsample_bytree: 0.9396893641976711
    gamma: 0
    learning_rate: 0.10241823755571676
    max_depth: 6
    n_estimators: 982
    subsample: 0.8545330472743582
    early_stopping_rounds: 10
    device: cuda
split:
  protocol: leaky
  leaky_test_size: 0.2
tracking:
  experiment: wisdm-har
  protocol_name: A1
  output_dir: docs/reports
