# Protocol B, watch, statistical features, honest XGBoost, GroupKFold 5.
seed: 42
data:
  processed_dir: data/processed
  device: watch
window:
  length_s: 5.0
  hop_s: 1.0
  min_coverage: 0.95
features:
  kind: statistical
model:
  name: xgboost
  params:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 10
    device: cuda
split:
  protocol: groupkfold
  n_splits: 5
tracking:
  experiment: wisdm-har
  protocol_name: B
  output_dir: docs/reports
