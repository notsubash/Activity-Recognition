[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "har"
version = "0.1.0"
description = "WISDM smartphone and smartwatch human activity recognition"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas==2.2.3",
    "numpy==2.2.6",
    "pyarrow==23.0.1",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "xgboost==2.1.4",
    "pyyaml==6.0.3",
    "fastapi==0.115.14",
    "uvicorn==0.34.3",
    "onnxruntime==1.20.1",
    "mlflow==2.22.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.12.0",
    "pre-commit==4.6.2",
]

# Src layout: package har lives under src/ (Poetry equivalent:
# packages = [{ include = "har", from = "src" }])
[tool.setuptools.packages.find]
where = ["src"]
include = ["har*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.10"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "venv", "data/external", "data/processed"]

[tool.nbqa.addopts]
black = ["--line-length=100"]
