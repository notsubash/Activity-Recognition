# protocol_b_phone_raw_flat_xgb: Protocol B, phone, flattened raw windows (same representation as A2:
# 5 s / 1 s), student XGBoost params, GroupKFold 5. RQ2: leaky A2 vs honest B.
seed: 42
data:
  processed_dir: data/processed
  device: phone
window:
  length_s: 5.0
  hop_s: 1.0
  min_coverage: 0.95
features:
  kind: raw_flat
model:
  name: xgboost
  params:
    colsample_bytree: 0.9396893641976711
    gamma: 0
    learning_rate: 0.10241823755571676
    max_depth: 6
    n_estimators: 982
    subsample: 0.8545330472743582
    early_stopping_rounds: 10
    device: cuda
split:
  protocol: groupkfold
  n_splits: 5
tracking:
  experiment: wisdm-har
  protocol_name: B
  output_dir: docs/reports
